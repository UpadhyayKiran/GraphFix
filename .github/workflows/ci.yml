name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install GraphFix and validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,explorer]"

      - name: Ruff
        run: python -m ruff check src tests scripts

      - name: Mypy
        run: python -m mypy src tests scripts

      - name: Pytest
        run: python -m pytest
